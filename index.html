<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The hero H1 is the LCP element and it is set in Fraunces. Preload it so
         the text does not paint in the fallback and then reflow. `crossorigin`
         is required even same-origin: fonts are always fetched in CORS mode,
         and without it the preload is discarded and fetched a second time. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-opsz-latin.woff2" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="preconnect" href="https://www.clarity.ms" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#050d6e" />
    <!-- ============================ ANALYTICS ============================
         Two free tools. Replace the two placeholder IDs below with the real
         ones AFTER the client creates each account (see the setup guide).
         Until then they simply collect no data — nothing breaks.

           1) Google Analytics 4  →  ID looks like  G-XXXXXXXXXX
              analytics.google.com → Admin → Data streams → Measurement ID
           2) Microsoft Clarity   →  ID looks like  abcde12345
              clarity.microsoft.com → Settings → Overview → Clarity project id

         The custom conversion event `book_call_click` is sent to GA4 from
         src/components/useCalendly.js on every booking CTA.
         ================================================================== -->

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "CLARITY_PROJECT_ID");
    </script>
    <style>
      /* First-load curtain - self-contained so it paints before the app CSS/JS. */
      #curtain { display: none; }
      html.curtain-on #curtain {
        display: flex; position: fixed; inset: 0; z-index: 999;
        background: #0c0380; align-items: center; justify-content: center;
        pointer-events: none;
        animation: curtain-lift .45s cubic-bezier(.2,.6,.2,1) .45s both;
      }
      html.curtain-on #curtain .c-logo {
        width: min(260px, 60vw); height: auto; display: block;
        animation: curtain-mark .4s cubic-bezier(.2,.6,.2,1) 0s both;
      }
      @keyframes curtain-mark { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
      @keyframes curtain-lift { to { transform: translateY(-101%); } }
    </style>
    <script>
      (function () {
        // Scroll-reveal styles only apply when JS runs - prerendered HTML stays
        // fully visible for crawlers and no-JS visitors.
        document.documentElement.classList.add('js');
        try {
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!reduce && !sessionStorage.getItem('wwg-curtain')) {
            sessionStorage.setItem('wwg-curtain', '1');
            document.documentElement.classList.add('curtain-on');
            setTimeout(function () {
              document.documentElement.classList.remove('curtain-on');
              var c = document.getElementById('curtain');
              if (c && c.parentNode) c.parentNode.removeChild(c);
            }, 1000);
          }
        } catch (e) { /* private mode etc. - just skip the curtain */ }
      })();
    </script>
  </head>
  <body>
    <div id="curtain" aria-hidden="true"><img class="c-logo" src="/wwg-logo.jpg" alt="Working With God" /></div>

    <!-- Static form copies so Netlify's build-time crawler registers them.
         The real, validated forms are React-rendered (src/components/forms/*).
         These are never shown. If not deploying to Netlify, set VITE_FORM_ENDPOINT. -->
    <div hidden aria-hidden="true">
      <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <textarea name="message"></textarea>
        <input type="file" name="attachment" />
        <input type="checkbox" name="email-list" />
        <input name="bot-field" />
      </form>
      <form name="roundtable" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="org" />
        <input name="bot-field" />
      </form>
      <form name="quote-signup" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input name="bot-field" />
      </form>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
