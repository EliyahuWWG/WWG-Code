<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-route <title> and meta are injected at build time (vite-react-ssg + Seo.jsx). -->
    <!-- Fonts are self-hosted via @fontsource (imported in src/index.css). -->
    <!-- Calendly assets load on demand — see src/components/useCalendly.js. -->
    <style>
      /* First-load curtain — self-contained so it paints before the app CSS/JS. */
      #curtain { display: none; }
      html.curtain-on #curtain {
        display: flex; position: fixed; inset: 0; z-index: 999;
        background: #16211c; align-items: center; justify-content: center;
        pointer-events: none;
        animation: curtain-lift .55s cubic-bezier(.2,.6,.2,1) .85s both;
      }
      html.curtain-on #curtain .c-mark {
        font-family: "Fraunces Variable", Georgia, serif; font-weight: 500;
        font-size: 1.4rem; letter-spacing: -.02em; color: #f3eee2; margin: 0;
        display: flex; align-items: center; gap: .5em;
        animation: curtain-mark .45s cubic-bezier(.2,.6,.2,1) .1s both;
      }
      html.curtain-on #curtain .c-dot {
        width: 8px; height: 8px; background: #b3623c; border-radius: 50%; display: inline-block;
      }
      @keyframes curtain-mark { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes curtain-lift { to { transform: translateY(-101%); } }
    </style>
    <script>
      (function () {
        // Scroll-reveal styles only apply when JS runs — prerendered HTML stays
        // fully visible for crawlers and no-JS visitors.
        document.documentElement.classList.add('js');
        try {
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!reduce && !sessionStorage.getItem('rr-curtain')) {
            sessionStorage.setItem('rr-curtain', '1');
            document.documentElement.classList.add('curtain-on');
            setTimeout(function () {
              document.documentElement.classList.remove('curtain-on');
              var c = document.getElementById('curtain');
              if (c && c.parentNode) c.parentNode.removeChild(c);
            }, 1500);
          }
        } catch (e) { /* private mode etc. — just skip the curtain */ }
      })();
    </script>
  </head>
  <body>
    <div id="curtain" aria-hidden="true"><p class="c-mark"><span class="c-dot"></span>Reframed Reality</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
