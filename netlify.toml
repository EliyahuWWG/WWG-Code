# Working With God — Netlify config.
#
# Every route is prerendered by vite-react-ssg into its own index.html, and
# dist/404.html is generated by scripts/postbuild.mjs, so Netlify serves a real
# 404 for unknown URLs without a catch-all rewrite.

[build]
  command = "npm run build"
  publish  = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---- Content-hashed assets: immutable. --------------------------------
# Everything under /assets/ carries a Vite content hash, so a changed file is
# always a changed URL. Netlify's default for a static publish dir is
# `public, max-age=0, must-revalidate`, which costs a conditional round trip
# per asset on every repeat visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are hand-placed at a stable path, so they are versioned by filename
# rather than by hash. A year is still right; bump the filename to bust.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---- HTML: always revalidate. -----------------------------------------
# The prerendered HTML points at the hashed assets, so it must never be stale.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# dirStyle:'nested' serves routes as <route>/index.html, which the rule above
# does not match. Cover the extensionless URLs too.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Unhashed images in public/: a week, revalidatable. ---------------
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ---- Baseline security headers. ---------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# ---- Deploy contexts ----------------------------------------------------
# Production builds from `main`. Every other branch and every pull request
# gets its own URL, which is what the client reviews instead of screenshots.

[context.production.environment]
  VITE_SITE_ENV = "production"

# Branch deploys and deploy previews are NOINDEX'd at the header level.
# Without this, Netlify's preview URLs get crawled and you end up competing
# with your own client for their brand terms.
[context.deploy-preview.environment]
  VITE_SITE_ENV = "preview"

[context.branch-deploy.environment]
  VITE_SITE_ENV = "preview"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"
